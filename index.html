<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<title>Cartera de créditos colocados por IFI · SENPRENDE</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --logoBg:transparent; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --ok:#006300; --crit:#d03b3b; --warn:#8a5a00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --other:#a8a6a0;
  --q1:#c3e4ff; --q2:#73b6ff; --q3:#1f7eff; --q4:#0650da; --q5:#0d2b91; --qt1:#0b0b0b; --qt2:#0b0b0b; --qt3:#0b0b0b; --qt4:#ffffff; --qt5:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --plane:#0d0d0d; --logoBg:#fff; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --ok:#0ca30c; --crit:#e66767; --warn:#fab219;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#6b6a65;
    --q1:#173796; --q2:#1256d8; --q3:#2f86ff; --q4:#7bb9ff; --q5:#bfe1ff; --qt1:#ffffff; --qt2:#ffffff; --qt3:#0b0b0b; --qt4:#0b0b0b; --qt5:#0b0b0b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --logoBg:#fff; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --ok:#0ca30c; --crit:#e66767; --warn:#fab219;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --other:#6b6a65;
    --q1:#173796; --q2:#1256d8; --q3:#2f86ff; --q4:#7bb9ff; --q5:#bfe1ff; --qt1:#ffffff; --qt2:#ffffff; --qt3:#0b0b0b; --qt4:#0b0b0b; --qt5:#0b0b0b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:14px/1.45 Tahoma,Verdana,Geneva,sans-serif}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:18px 14px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.side-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.brand-t{font-size:16px;font-weight:650;line-height:1.25;margin-top:3px}
.burger{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 8px;cursor:pointer;font:inherit;font-size:13px}
.burger:hover{background:var(--wash)}
.burger svg{display:block}
.burger-t{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px}
.nav a svg{flex:none}
.nav .lbl{flex:1;font-family:Anton,Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-weight:400;font-size:14.5px;letter-spacing:.035em;line-height:1.2;text-transform:uppercase}
.nav a:hover{background:var(--wash);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.badge{font-size:11.5px;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--wash);color:var(--ink2);font-weight:600}
.nav a[aria-current="page"] .badge{background:rgba(127,127,127,.38);color:var(--surface)}
.badge.warn{color:var(--warn)}
.nav a[aria-current="page"] .badge.warn{color:var(--surface)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{width:100%;text-align:left}
.content{padding:22px 26px 48px;min-width:0;container-type:inline-size}
.foot{margin:28px 0 0;padding-top:14px;border-top:1px solid var(--border);font-size:12px;line-height:1.5;color:var(--ink2);text-align:center}
.ph{margin-bottom:12px}
.ph-row{display:flex;align-items:center;gap:14px}
.ph-row>div{flex:1;min-width:0}
.logo{flex:none;margin-left:auto;align-self:flex-start;height:88px;width:auto;display:block;background:var(--logoBg);border-radius:10px;padding:4px 6px}
.kic{flex:none;display:inline-block;width:34px;height:34px;background:var(--c) center/contain no-repeat}
.pic{width:44px;height:44px}
.nic{flex:none;width:18px;height:18px;background:currentColor;-webkit-mask:var(--w) center/contain no-repeat;mask:var(--w) center/contain no-repeat}
.k-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.hero-b{display:flex;align-items:center;gap:18px}
.hero .kic{width:60px;height:60px}
.k-bar{height:8px;border-radius:4px;background:var(--wash);overflow:hidden;margin:8px 0 8px}
.k-bar i{display:block;height:100%;background:var(--ink2);border-radius:0 4px 4px 0;min-width:2px}
.mt{height:16px;width:100%;background:var(--wash);border-radius:4px;overflow:hidden}
.mf{height:100%;border-radius:0 4px 4px 0}
.meta .hrow{grid-template-columns:minmax(110px,190px) minmax(0,1fr) minmax(230px,auto)}
.meta .hv{min-width:230px}
.meta .hrow.tot{margin-top:8px;padding-top:11px;border-top:1px solid var(--grid);border-radius:0 0 8px 8px}
.meta .hrow.tot .hl{font-weight:650}
svg.mp{width:100%;height:auto;display:block}
.mapwrap{max-width:820px;margin:0 auto}
.mp .sh{stroke:var(--surface);stroke-width:1.2;stroke-linejoin:round;outline:none;fill:var(--grid)}
.mp .q1{fill:var(--q1)}.mp .q2{fill:var(--q2)}.mp .q3{fill:var(--q3)}.mp .q4{fill:var(--q4)}.mp .q5{fill:var(--q5)}
.mp .hl{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;pointer-events:none}
.mp text{font-size:12px;font-weight:600;font-family:inherit;pointer-events:none;fill:var(--ink2)}
.mp text.t1{fill:var(--qt1)}.mp text.t2{fill:var(--qt2)}.mp text.t3{fill:var(--qt3)}.mp text.t4{fill:var(--qt4)}.mp text.t5{fill:var(--qt5)}
.mp .lead{stroke:var(--muted);stroke-width:.9;fill:none}.mp .dot{fill:var(--muted)}
.mscale{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--grid);font-size:12px;color:var(--ink2)}
.mscale .ramp{display:inline-flex;align-items:center;gap:6px}
.mscale .sws{display:inline-flex;gap:2px}.mscale .sws i{display:block;width:26px;height:12px}
.mscale .sws i:first-child{border-radius:3px 0 0 3px}.mscale .sws i:last-child{border-radius:0 3px 3px 0}
.mscale .none{display:inline-flex;align-items:center;gap:6px}.mscale .none i{display:block;width:14px;height:12px;border-radius:3px;background:var(--grid)}
.attr{font-size:12px;color:var(--ink2);margin:12px 0 0;line-height:1.5}
.attr a{color:inherit}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .kic{background-image:var(--w)}}
:root[data-theme="dark"] .kic{background-image:var(--w)}
.defs{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:8px 16px;margin:0;font-size:13px}
.defs dt{font-weight:650}
.defs dd{margin:0;color:var(--ink2)}
@container (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-family:Anton,Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-weight:400;font-size:14px;line-height:1.25;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
h1{font-family:Anton,Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:28px;line-height:1.15;margin:2px 0 4px;font-weight:400;letter-spacing:.025em;text-transform:uppercase}
h2{font-size:15px;margin:0;font-weight:650}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font-family:inherit}
.btn{border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--wash)}
:is(.btn,select,input,button,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.status{font-size:12.5px;color:var(--ink2);margin:0 0 10px;min-height:18px}
.status.err{color:var(--crit)}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.f select,.f input,.search{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink);max-width:200px}
.grow{flex:1}
.scope{font-size:12.5px;color:var(--ink2);margin:0 2px 14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:0}
.k-l{font-size:12.5px;color:var(--ink2)}
.k-v{font-size:26px;font-weight:650;letter-spacing:-.01em;margin:2px 0 2px}
.k-pc{white-space:nowrap}
.k-v.k-txt{font-size:19px;line-height:1.25;overflow-wrap:anywhere;margin-top:6px}
@container (max-width:880px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-column:1/-1}}
.hero .k-v{font-size:40px;line-height:1.05;margin:4px 0 6px}
.k-s{font-size:12.5px;color:var(--ink2)}
.k-s.ok{color:var(--ok)}
.k-s.bad{color:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--warn);background:var(--wash);border:0;border-radius:999px;padding:3px 10px;cursor:pointer;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.grid>*{grid-column:span 6}
.grid>.full{grid-column:1/-1}
.grid>.s7{grid-column:span 7}
.grid>.s5{grid-column:span 5}
@container (max-width:900px){.grid>.s7,.grid>.s5{grid-column:1/-1}}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.legend{display:flex;gap:2px 8px;flex-wrap:wrap;margin:0 0 6px}
.lg{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;padding:2px 6px;border-radius:6px}
.lg.on{background:var(--wash);color:var(--ink)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.hrow{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) minmax(104px,auto);gap:10px;align-items:center;padding:5px 6px;border-radius:8px}
.wide .hrow{grid-template-columns:minmax(180px,340px) minmax(0,1fr) minmax(120px,auto)}
.hrow:hover,.hrow:focus-visible{background:var(--wash)}
.hl{font-size:13px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ht{height:16px;display:flex;align-items:center}
.hs{display:flex;gap:2px;height:16px;min-width:4px}
.seg{height:100%;min-width:2px}
.hs .seg:last-child{border-radius:0 4px 4px 0}
.hv{font-size:12.5px;text-align:right;white-space:nowrap}
.hv strong{font-weight:650}
.hv span{color:var(--ink2);margin-left:6px}
.colchart{overflow:hidden}
.colchart svg{display:block;max-width:100%}
.colchart text{font:11.5px Tahoma,Verdana,Geneva,sans-serif;fill:var(--ink2)}
.empty{color:var(--ink2);padding:22px 4px;text-align:center}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.grid>.lockcard{grid-column:1/-1;justify-self:center;width:100%;max-width:420px;margin-top:18px}
.lockcard .lk-ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;background:var(--wash);color:var(--ink);margin-bottom:10px}
.lockcard form{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lockcard label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.lockcard input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink);max-width:none}
.lockcard input[aria-invalid="true"]{border-color:var(--crit)}
.lockcard .lk-err{min-height:18px;margin:0;font-size:12.5px;color:var(--crit)}
.lockcard .btn{align-self:flex-start}
.badge.lockb{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;color:var(--ink2)}
.nav a[aria-current="page"] .badge.lockb{color:var(--surface)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;border-bottom:1px solid var(--axis);padding:6px 8px;white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:650;border-top:1px solid var(--axis);border-bottom:0}
.cell-ifi{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.pager{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);margin-top:10px;justify-content:flex-end}
.note{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13px}
.note:last-child{border-bottom:0}
.note b{font-weight:650}
.ico{font-weight:700}
.ico.warn{color:var(--warn)}
.ico.info{color:var(--ink2)}
.chk{display:inline-flex;gap:6px;align-items:center;margin-top:6px;cursor:pointer}
.foot{font-size:12px;color:var(--ink2);margin-top:18px;line-height:1.5}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.14);font-size:12.5px;display:none;max-width:330px}
.tip-t{font-weight:650;margin-bottom:4px}
.tip-r{display:flex;gap:7px;align-items:center;line-height:1.5}
.tip-r .key{width:12px;height:3px;border-radius:2px;flex:none}
.tip-r strong{font-weight:650}
.tip-n{color:var(--ink2)}
.tip-tot{border-top:1px solid var(--grid);margin-top:4px;padding-top:4px}
@media (min-width:861px){
  .shell.rail{grid-template-columns:68px minmax(0,1fr)}
  .rail .side{padding:18px 12px}
  .rail .side-top{justify-content:center}
  .rail .side-brand,.rail .side-foot,.rail .nav .lbl,.rail .nav .badge{display:none}
  .rail .nav a{justify-content:center;padding:10px}
}
@media (prefers-reduced-motion:reduce){.shell{transition:none}}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}.grid>*,.grid>.s7,.grid>.s5{grid-column:1/-1}.hero .k-v{font-size:42px}.hero .kic{width:46px;height:46px}.hero-b{gap:12px}
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px 14px;gap:10px}
  .side-top{align-items:center}
  .burger-t{display:inline}
  .side .nav,.side .side-foot{display:none}
  .side.open .nav{display:flex}
  .nav a{padding:9px 10px}
  .side.open .side-foot{display:flex;flex-direction:row;flex-wrap:wrap;margin-top:0;align-items:center}
  .side-foot .btn{width:auto}
  .content{padding:16px 14px 40px}
  .logo{height:54px;padding:3px 4px}
  .defs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero,.kpi-pct,.kpi-sec{grid-column:1/-1}}
@media (max-width:640px){
  .mp text,.mp .lead,.mp .dot{display:none}
  .hrow,.wide .hrow,.meta .hrow{grid-template-columns:minmax(0,1fr) auto}
  .hl{grid-column:1/-1}
  .f select,.f input{max-width:150px}
}
@media (forced-colors:active){.seg,.sw{forced-color-adjust:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-top">
      <div class="side-brand">
        <div class="eyebrow">SENPRENDE. SUB DIRECCIÓN FINANCIERA</div>
        <div class="brand-t">Ejecución de Cartera de Créditos por IFI</div>
      </div>
      <button class="burger" id="side-toggle" type="button" aria-controls="nav" aria-expanded="true" aria-label="Contraer menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="burger-t">Menú</span></button>
    </div>
    <nav class="nav" id="nav" aria-label="Secciones del tablero"></nav>
    <div class="side-foot">
      <button class="btn" id="btn-load" type="button" title="Lee la hoja BD_Cartera de un Excel (.xlsx) o un CSV con las mismas columnas">Cargar Excel o CSV actualizado</button>
      <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
      <button class="btn" id="btn-theme" type="button" aria-label="Cambiar entre tema claro y oscuro">Tema</button>
    </div>
  </aside>
  <div class="content">
    <header class="ph">
      <div class="ph-row">
        <span class="kic pic" id="pic" aria-hidden="true"></span>
        <div>
          <h1 id="ptitle"></h1>

/* ───────── normalización de la base ───────── */
const stripAcc = x => x.normalize('NFD').replace(/[̀-ͯ]/g, '');

const DEPMAP = new Map(DEPS.map(d => [hkey(d), d]));
const STOP = new Set(['de','del','la','las','el','los','y','e','en','a','al','con','por','para','sal','mar','uso','sin','sus','una','uno']);
const titleCase = t => t.toLowerCase().split(/\s+/).filter(Boolean).map((w, i) => (i > 0 && STOP.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
function prettySector(t) {
  const out = t.trim().split(/\s+/).map(w => {
    const hy = w.includes('-');
    return w.split('-').map(p => {
      const letters = p.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g, '');
      if (letters.length <= 3 && !STOP.has(p.toLowerCase())) return p.toUpperCase();
      const lo = p.toLowerCase();
      return hy ? lo.charAt(0).toUpperCase() + lo.slice(1) : lo;
    }).join('-');
  }).join(' ');
  return out.charAt(0).toUpperCase() + out.slice(1);

function num(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let t = String(v).trim().replace(/^L\.?\s*/i, '').replace(/\s/g, '');
  if (t.includes(',') && t.includes('.')) { t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, ''); }

function toISO(v) {

/* El género es solo Femenino o Masculino; CRAC y asociaciones no tienen género (queda vacío) */
const GEN = { femenino: 'Femenino', f: 'Femenino', mujer: 'Femenino', masculino: 'Masculino', m: 'Masculino', hombre: 'Masculino' };

function prettyProg(t) { const k = hkey(t); return PROG[k] || (k.length <= 8 && !k.includes(' ') ? k.toUpperCase() : titleCase(k)); }

function normalizeRows(raw) {
  if (!raw || !raw.length) return { error: 'El archivo no tiene filas de datos.' };
  const keys = new Set(); raw.slice(0, 50).forEach(r => Object.keys(r).forEach(k => keys.add(k)));
  const hmap = {}; keys.forEach(k => { hmap[hkey(k)] = k; });
  const gk = Object.keys(hmap).find(k => k.startsWith('genero'));
  const c = {
    ifi: hmap['institucion ifi'], nro: hmap['numero prestamo'], tp: hmap['tipo persona'], gen: gk && hmap[gk],
    dep: hmap['departamento'], mun: hmap['municipio'], monto: hmap['monto original credito'], fd: hmap['fecha desembolso'],
    plazo: hmap['plazo meses'], tasa: hmap['tasa interes corriente'], prog: hmap['proyecto'], sub: hmap['sub producto'],
    sec: hmap['sector economico'], est: hmap['estado credito'], dias: hmap['dias atraso'], saldo: hmap['saldo capital'],
    saldoV: hmap['saldo capital vencido'], fc: hmap['fecha corte']
  };
  const need = { ifi: 'Institucion_IFI', monto: 'Monto_Original_Credito', fd: 'Fecha_Desembolso' };
  const missing = Object.keys(need).filter(k => !c[k]).map(k => need[k]);
  if (missing.length) return { error: 'Faltan columnas obligatorias: ' + missing.join(', ') + '. Se esperan los encabezados de la hoja BD_Cartera.' };
  const g = (r, k) => c[k] ? r[c[k]] : null;
  const rows = []; let skipped = 0;
  raw.forEach((r, i) => {
    const ifi = (g(r, 'ifi') ?? '').toString().trim().toUpperCase();
    const monto = num(g(r, 'monto')); const fd = toISO(g(r, 'fd'));

function dedupe(rows) {
  const best = new Map();
  rows.forEach((r, i) => { if (!r.nro) return; const b = best.get(r.nro); if (!b || (r.fc || '') >= (b.r.fc || '')) best.set(r.nro, { r, i }); });
  return rows.filter(r => !r.nro || best.get(r.nro).r === r);
}

function analyze(rows, catalog) {
  const notes = [];
  const byNro = new Map(); rows.forEach(r => { if (r.nro) (byNro.get(r.nro) || byNro.set(r.nro, []).get(r.nro)).push(r); });
  const dups = [...byNro.entries()].filter(([, a]) => a.length > 1);
  if (dups.length) {
    const extra = dups.reduce((s, [, a]) => s + a.length - 1, 0);
    const extraMonto = dups.reduce((s, [, a]) => s + a.slice(1).reduce((x, r) => x + r.monto, 0), 0);
    notes.push({ level: 'warn', dup: true,
      title: `${plural(dups.length, 'número de préstamo repetido', 'números de préstamo repetidos')}`,
      detail: dups.map(([n, a]) => `${n} (${a[0].ifi}) aparece ${a.length} veces${a.some(r => r.fc) ? ' con cortes ' + a.map(r => fmtDate(r.fc)).join(' y ') : ''}`).join('; ') +
        `. Si es el mismo crédito reportado dos veces, se cuentan ${plural(extra, 'crédito', 'créditos')} y ${L2(extraMonto)} de más.` });
  }
  const sinNro = rows.filter(r => !r.nro);
  if (sinNro.length) notes.push({ level: 'warn', title: `${plural(sinNro.length, 'crédito sin número de préstamo', 'créditos sin número de préstamo')}`,
    detail: 'IFI: ' + [...new Set(sinNro.map(r => r.ifi))].join(', ') + `. Monto: ${L2(sinNro.reduce((s, r) => s + r.monto, 0))}. No se pueden detectar duplicados de estos registros.` });
  const sinEst = rows.filter(r => !r.est);
  if (sinEst.length) notes.push({ level: 'warn', title: `${plural(sinEst.length, 'crédito sin estado', 'créditos sin estado')}`,
    detail: 'IFI: ' + [...new Set(sinEst.map(r => r.ifi))].join(', ') + '. Se cuentan en el monto colocado pero no como «vigentes».' });
  const cat = new Set((catalog || []).map(hkey));

    const bad = [...new Set(rows.map(r => r.secRaw).filter(Boolean))].filter(s => !cat.has(hkey(s)));
    if (bad.length) {
      const nBad = rows.filter(r => bad.includes(r.secRaw)).length;
      notes.push({ level: 'warn', title: `${bad.length} de ${new Set(rows.map(r => r.secRaw).filter(Boolean)).size} etiquetas de sector no están en la hoja Catálogos`,
        detail: `Afectan a ${plural(nBad, 'crédito', 'créditos')} (${fmtPct(pct(nBad, rows.length))}): ${bad.map(prettySector).join('; ')}. Los gráficos las muestran tal como las reporta cada IFI, sin agruparlas.` });
    }

  }

async function sha256hex(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function lockPanel(pd) {
  const inp = h('input', { id: 'pw', type: 'password', autocomplete: 'off', 'aria-describedby': 'pw-err', required: 'true' });
  const err = h('p', { class: 'lk-err', id: 'pw-err', role: 'alert' });
  const form = h('form', { novalidate: 'true' }, h('label', { for: 'pw' }, 'Contraseña'), inp, err, h('button', { class: 'btn pri', type: 'submit' }, 'Desbloquear'));
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    try {
      if (await sha256hex(inp.value) === LOCK_SHA) { state.unlocked = true; render(); return; }
      err.textContent = 'Contraseña incorrecta. Inténtalo de nuevo.';
    } catch (x) { err.textContent = 'Este navegador no permite verificar la contraseña.'; }
    inp.setAttribute('aria-invalid', 'true'); inp.value = ''; inp.focus();
  });
  inp.addEventListener('input', () => inp.removeAttribute('aria-invalid'));
  setTimeout(() => inp.focus(), 0);
  return h('section', { class: 'card lockcard', id: 'c-lock' }, h('span', { class: 'lk-ic' }, lockIcon(20)), h('h2', null, 'Página protegida'),
    h('p', { class: 'sub' }, `Escribe la contraseña para ver «${pd.label}».`), form);
}
/* Menú lateral desplegable: en escritorio se contrae a una columna de iconos; en móvil se abre y cierra sobre el encabezado */
const shellEl = document.querySelector('.shell'), sideEl = document.querySelector('.side'), burger = document.querySelector('#side-toggle');
const mqMovil = matchMedia('(max-width:860px)');
let railOn = false; try { railOn = localStorage.getItem('senp-menu-contraido') === '1'; } catch (e) { /* sin almacenamiento */ }
function syncMenu() {
  const mov = mqMovil.matches;
  shellEl.classList.toggle('rail', railOn && !mov);
  const abierto = mov ? sideEl.classList.contains('open') : !railOn;
  burger.setAttribute('aria-expanded', String(abierto));
  burger.setAttribute('aria-label', abierto ? 'Contraer menú' : 'Desplegar menú');
}
burger.addEventListener('click', () => {
  if (mqMovil.matches) sideEl.classList.toggle('open');
  else { railOn = !railOn; try { localStorage.setItem('senp-menu-contraido', railOn ? '1' : '0'); } catch (e) { /* sin almacenamiento */ } }
  syncMenu();
});
mqMovil.addEventListener('change', syncMenu);
syncMenu();
/* Al salir de una página protegida (hacia cualquier otra, incluida la otra protegida) se vuelve a bloquear */
function setView(id) {
  const prev = PAGES.find(p => p.id === state.view);
  if (prev && prev.locked) state.unlocked = false;
  state.view = id; state.page = 0;
  sideEl.classList.remove('open'); syncMenu();
}
function go(id) {
  if (!VIEWS.includes(id)) id = 'resumen';
  if (state.view === id) return;
  setView(id);
  try { if (location.hash !== '#' + id) location.hash = id; } catch (e) { /* visor sin hash */ }
  render(); window.scrollTo(0, 0);
}
addEventListener('hashchange', () => { const v = viewFromHash(); if (v !== state.view) { setView(v); render(); window.scrollTo(0, 0); } });
function buildNav() {
  const nav = $('#nav'); nav.replaceChildren();
  for (const p of PAGES) {
    const badge = h('span', { class: 'badge' });
    const a = h('a', { href: '#' + p.id, onclick: e => { e.preventDefault(); go(p.id); } }, icon(p.id), h('span', { class: 'lbl' }, p.label), badge);
    nav.append(a); navRefs[p.id] = { a, badge };
  }
}
function updateNav(rows) {
  for (const p of PAGES) {
    const { a, badge } = navRefs[p.id];
    if (p.id === state.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    const lk = p.locked && !state.unlocked;
    if (lk) { badge.replaceChildren(lockIcon(13)); badge.className = 'badge lockb'; badge.hidden = false; a.setAttribute('aria-label', p.label + ' (protegida con contraseña)'); a.title = p.label + ' (protegida con contraseña)'; continue; }
    a.removeAttribute('aria-label'); a.title = p.label; badge.replaceChildren();
    let t = '', warn = false;
    if (p.id === 'detalle') t = nf0.format(filtered().length);
    if (p.id === 'notas') { const w = state.notes.filter(n => n.level === 'warn').length; t = w ? String(w) : ''; warn = w > 0; }
    badge.textContent = t; badge.className = 'badge' + (warn ? ' warn' : ''); badge.hidden = !t;
  }
}

/* ───────── estructura y render ───────── */
const cardsEl = $('#cards'); let observers = [];
const mkCard = (c, span) => h('section', { class: 'card' + (span === true ? ' full' : span ? ' ' + span : ''), id: c.id },
  h('div', { class: 'card-h' }, h('div', null, h('h2', null, c.title), h('p', { class: 'sub' })), h('div', { class: 'actions' })),
  h('div', { class: 'leg' }), h('div', { class: 'body' }));
function renderCard(c, rows) {
  const el = $('#' + c.id, cardsEl), body = $('.body', el), leg = $('.leg', el), actions = $('.actions', el);
  $('.sub', el).textContent = rows.length ? c.sub(rows) : c.sub([{ fd: '2000-01-01', mes: '2000-01' }]);
  leg.replaceChildren(); actions.replaceChildren();
  if (!rows.length && !c.always) { body.replaceChildren(h('div', { class: 'empty' }, 'Sin créditos con los filtros seleccionados.')); return; }
  const out = c.build(rows);
  const asTable = !c.noToggle && state.views[c.id] === 'table';
  if (!c.noToggle) {
    actions.append(h('button', { class: 'btn', type: 'button', 'aria-pressed': asTable ? 'true' : 'false', onclick: () => { state.views[c.id] = asTable ? 'chart' : 'table'; renderCard(c, rows); } }, asTable ? 'Ver gráfico' : 'Ver tabla'));
  }
  if (out.legend && !asTable) leg.append(out.legend);
  body.replaceChildren(asTable ? tableEl(out.table) : out.chart);
  if (!asTable && out.draw) { out.draw(); const ro = new ResizeObserver(() => out.draw()); ro.observe(out.chart); observers.push(ro); }
}

function renderKpis(rows) {
  const n = rows.length, monto = sum(rows, r => r.monto), saldo = sum(rows, r => r.saldo);
  const ifis = new Set(rows.map(r => r.ifi)).size, deps = new Set(rows.map(r => r.dep)).size;
  const vig = rows.filter(r => r.est === 'VIGENTE').length;
  const mora = rows.filter(r => r.dias > 0 || r.saldoV > 0), saldoV = sum(rows, r => r.saldoV);
  const nat = rows.filter(r => r.gen);
  const muj = rows.filter(r => r.gen === 'Femenino');
  const montos = rows.map(r => r.monto);
  const pl = rows.filter(r => r.plazo != null), tr = rows.filter(r => r.tasa != null);
  const plazoProm = pl.length ? sum(pl, r => r.plazo) / pl.length : null;
  const tasaProm = tr.length ? sum(tr, r => r.tasa * r.monto) / sum(tr, r => r.monto) : null;
  const tile = (k, l, v) => h('div', { class: 'card' }, h('div', { class: 'k-h' }, kicon(k), h('div', { class: 'k-l' }, l)), h('div', { class: 'k-v' }, v));
  const hero = h('div', { class: 'card hero' }, h('div', { class: 'hero-b' }, kicon('monto'), h('div', null, h('div', { class: 'k-l' }, 'Monto colocado'), h('div', { class: 'k-v' }, n ? Lc(monto) : 'L 0'))));
  const dupNote = state.notes.find(x => x.dup);
  if (dupNote && !state.dedupe) hero.append(h('button', { class: 'chip', type: 'button', onclick: () => go('notas') }, '⚠ Hay números de préstamo repetidos; ver notas'));
  if (dupNote && state.dedupe) hero.append(h('div', { class: 'k-s', style: 'margin-top:8px' }, 'Repetidos excluidos (ver notas)'));
  const moraTile = tile('mora', 'Créditos con atraso', nf0.format(mora.length));
  const mp = metaProgress(rows);
  const pctTile = h('div', { class: 'card kpi-pct' }, h('div', { class: 'k-h' }, kicon('avance'), h('div', { class: 'k-l' }, 'Colocación global')),
    h('div', { class: 'k-v' }, fmtPct(mp.pct)),
    h('div', { class: 'k-bar', role: 'img', 'aria-label': `${fmtPct(mp.pct)} de la meta global` }, h('i', { style: `width:${Math.min(100, mp.pct).toFixed(2)}%` })));
  const metaTile = tile('meta', 'Meta a financiar', Lm(mp.meta));
  const secG = group(rows.filter(r => r.sec), r => r.sec), secMax = Math.max(0, ...secG.map(g => g.monto));
  const topSec = secG.filter(g => secMax > 0 && Math.abs(g.monto - secMax) < 0.005).map(g => String(g.label)).sort((x, y) => x.localeCompare(y, 'es'));
  const secPct = fmtPct(pct(secMax, monto));
  const secTile = tile('sector', 'Sector con mayor colocación', topSec.length ? topSec.join(' · ') : '—');
  if (topSec.length) secTile.querySelector('.k-v').append(h('span', { class: 'k-pc' }, ` · ${secPct}${topSec.length > 1 ? ' c/u' : ''}`));
  secTile.classList.add('kpi-sec'); secTile.querySelector('.k-v').classList.add('k-txt');
  $('#kpis').replaceChildren(hero, pctTile, metaTile,
    tile('creditos', 'Créditos colocados', nf0.format(n)),
    tile('saldo', 'Saldo de capital', Lc(saldo)),
    moraTile,
    tile('plazo', 'Plazo promedio', plazoProm == null ? '—' : (Math.round(plazoProm * 10) / 10).toLocaleString('en-US') + ' meses'),
    tile('mujeres', 'Créditos a mujeres', nat.length ? fmtPct(pct(muj.length, nat.length)) : '—'), secTile);
}

function render() {
  observers.forEach(o => o.disconnect()); observers = [];
  const pd = PAGES.find(p => p.id === state.view) || PAGES[0];
  if (pd.locked && !state.unlocked) {
    $('#btn-theme').textContent = effTheme() === 'dark' ? 'Tema claro' : 'Tema oscuro';
    $('#filters').hidden = true; $('#scope').hidden = true; $('#kpis').hidden = true; $('#kpis').replaceChildren();
    $('#ptitle').textContent = pd.title; $('#psub').textContent = 'Contenido protegido con contraseña'; $('#pic').style.cssText = icVars(PIC[pd.id]);
    document.title = pd.title + ' · Cartera por IFI · SENPRENDE';
    cardsEl.replaceChildren(lockPanel(pd)); updateNav();
    return;
  }
  const rows = filtered(); lastRows = rows;
  for (const [k, v] of Object.entries(state.filters)) { const el = $('#f-' + k); if (el && el.value !== v) el.value = v; }
  $('#btn-theme').textContent = effTheme() === 'dark' ? 'Tema claro' : 'Tema oscuro';
  $('#filters').hidden = !!pd.nofilters; $('#scope').hidden = !!pd.nofilters;
  $('#ptitle').textContent = pd.title; $('#psub').textContent = pd.sub(); $('#pic').style.cssText = icVars(PIC[pd.id]);
  document.title = pd.title + ' · Cartera por IFI · SENPRENDE';
  const all = base();
  const dmin = rows.length ? rows.reduce((a, r) => r.fd < a ? r.fd : a, rows[0].fd) : null, dmax = rows.length ? rows.reduce((a, r) => r.fd > a ? r.fd : a, rows[0].fd) : null;
  $('#scope').textContent = `${plural(rows.length, 'crédito', 'créditos')} de ${nf0.format(all.length)}` + (dmin ? ` · desembolsos del ${fmtDate(dmin)} al ${fmtDate(dmax)}` : '') + ` · ${L2(sum(rows, r => r.monto))}`;
  $('#kpis').hidden = !pd.kpis; if (pd.kpis) renderKpis(rows); else $('#kpis').replaceChildren();
  cardsEl.replaceChildren(...pd.cards.map(x => mkCard(CARD[x.c], x.full || x.span)));
  pd.cards.forEach(x => renderCard(CARD[x.c], rows));
  updateNav(rows);
}

function buildFilters() {
  const box = $('#filters'); box.replaceChildren();
  const defs = [['prog', 'Programa', r => r.prog], ['ifi', 'IFI', r => r.ifi], ['dep', 'Departamento', r => r.dep], ['sec', 'Sector económico', r => r.sec], ['gen', 'Género', r => r.gen], ['mes', 'Mes', r => r.mes]];
  for (const [k, label, get] of defs) {
    const vals = [...new Set(state.all.map(get))].filter(Boolean).sort((a, b) => k === 'ifi' ? state.ifiOrder.indexOf(a) - state.ifiOrder.indexOf(b) : a.localeCompare(b, 'es'));
    const sel = h('select', { id: 'f-' + k }, h('option', { value: '' }, 'Todos'), vals.map(v => h('option', { value: v }, k === 'mes' ? MES_FULL[+v.slice(5, 7) - 1] + (new Set(vals.map(x => x.slice(0, 4))).size > 1 ? ' ' + v.slice(0, 4) : '') : v)));
    sel.addEventListener('change', () => { state.filters[k] = sel.value; state.page = 0; render(); });
    box.append(h('div', { class: 'f' }, h('label', { for: 'f-' + k }, label), sel));
  }
  box.append(h('button', { class: 'btn', type: 'button', onclick: () => { state.filters = { ...EMPTY_F }; state.page = 0; render(); } }, 'Limpiar filtros'), h('div', { class: 'grow' }));
}

/* ───────── tema y carga de archivos ───────── */
function effTheme() { return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
$('#btn-theme').addEventListener('click', () => { document.documentElement.dataset.theme = effTheme() === 'dark' ? 'light' : 'dark'; render(); });
const status = (msg, err) => { const s = $('#status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); };
$('#btn-load').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  status('Leyendo ' + file.name + '…');
  try {
    const { raw, catalog, sheet } = await readFile(file);
    const res = normalizeRows(raw);
    if (res.error) { status(res.error, true); return; }
    setData(res.rows, { catalog, source: `archivo cargado «${file.name}»${sheet ? ', hoja ' + sheet : ''}` });
    status(`Cargado «${file.name}»: ${plural(res.rows.length, 'crédito', 'créditos')}` + (res.skipped ? `; ${plural(res.skipped, 'fila omitida', 'filas omitidas')} por no tener IFI, monto o fecha de desembolso` : '') + '. Se lee en tu navegador; al recargar la página vuelve la base original.');
  } catch (err) { status('No se pudo leer el archivo: ' + err.message, true); }
});

/* ───────── arranque ───────── */
buildNav(); state.view = viewFromHash();
const first = normalizeRows(seed.rows);
setData(first.rows, { catalog: seed.catalogoSectores, source: `hoja ${seed.sheet} de «${seed.file}»` });
window.__dash = { go, PAGES, state, readFile, normalizeRows, setData, filtered, parseCSV, toISO, analyze, dedupe, group, render };
})();
</script>
